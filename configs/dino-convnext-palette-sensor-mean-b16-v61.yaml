  V26/V27 trained only a small coarse branch and found no gain; this is a distinct
  test, not an assumed fix. No output correction, larger corpus or protected-final
  scoring. Require CPU restart and genuine CUDA all-domain gradient/state/portable-EMA
  preflight before training.
