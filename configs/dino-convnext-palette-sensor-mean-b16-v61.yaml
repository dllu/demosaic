  remains frozen. Keep wide8-stop palette, Commons40170/native128/paired32, fractions,
  precision, geometry and original8x validation fixed. Reuse completed V60 control
  rather than repeat it. Stop at1000 under the original schedule for complete photo/paired/analytic/hue/GFX/four-camera
