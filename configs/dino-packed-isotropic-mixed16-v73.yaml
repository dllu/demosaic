experiment_notes: Fresh mixed-domain effective B16 pilot motivated by completed training-only
  batch/coordinate tests. Four consecutive original B4 source groups use identical
  per-data-step domain schedule, global source indices, original group losses and
  degradation RNG. Accumulate four B4 forwards then clip/Adam/EMA once, chosen by
  actual IEEE FP32 channels_last no-DINO/DINO execution sweep. Gain32 neural RAW inputs/residual1/32,
  IEEE FP32/no AMP or TF32, original seed51/core capacity and frozen40170 Commons/native128/paired32
  sources; no new data or Gaussian/checkpoint initialization. Full640000-example horizon=40000
  optimizer updates/160000 B4 source steps, warmup8000 examples=500 updates; first
  quality gate32000 examples=2000 updates via stop-after. EMA cap .999**4 matches
  the prior cap in example units approximately; original adaptive warmup retained.
  Initial12 optimizer updates are a checked genuine prefix, then full-state resume
  to2000 with unchanged recipe/schedule/source. Only DINO presence/fusion differs
  between this matched pair. Compared with old V70/V71 this exploratory candidate
  changes units, precision and mixed optimizer batching; it is not a single-factor
  ablation against those models. No held-out/GFX/protected-final optimization, automatic
  continuation/promotion or convergence claim. Full quality/native160px triplet and
  real GFX foliage/fence review required.
