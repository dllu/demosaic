experiment_notes: Fresh matched RAW-native no-dino quality arm after completed actual
  batch sweep selects B4. Original quality horizon640000 examples=160000 updates,
  first native quality review32000 examples=8000 updates via explicit --stop-after
  8000, warmup8000 examples=2000 updates. All chosen before any quality training;
  earlier B16 templates never quality-trained. Keep LR2e-4 unscaled, same restoration
  seed51 and frozen40170 Commons/native128 captures106 groups/paired32, fractions.25/.25,
  native256/BF16, workers4/2/2, wide8 palette, geometry4x-to-PSF-to-area2, noise/ADC,
  loss and original8x validation. Only DINO presence/fusion differs between V70/V71.
  Fresh AdamW/EMA, no checkpoint or Gaussian initialization; benchmark weights never
  enter quality runs. Serial owners, finite-state/source/data/actual-construction
  checks and full quality/native review required. No protected-final scoring, automatic
  extension, promotion, output correction or training-source admission. Same-image-count
  horizon vs original B16 plan does not establish batch convergence equivalence or
  isolate architecture changes against old RGB models.
