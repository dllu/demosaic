scope: >-
  Three fresh identical relative-phase heads adopt all 1000 V148 batches /
  4000 old observations and parents. Noisy-only routing, 16 DN scale floor,
  no peak weighting, 882 supervised batches / 3528 observations, and all
  1000 AdamW/EMA clocks match V152 relative-phase. Pre-control must exactly
  reproduce its trace, raw/EMA/Adam states and 1644 final prediction arrays.
  Only the spectral term's evaluation changes: pre-support four-CFA coefficient
  error versus analysis of delivered four-CFA mosaic error versus delivered
  all-RGB error packed into twelve C-major spatial phases. Delivered terms see
  actual output after overlap synthesis, data-dependent local support and signed
  Malvar interpolation. They reuse original frame size, taper, plane detrending,
  smooth frequency band and 0.25 spectral weight. RGB repeats the four-phase
  frame-noise proxy for each color; this defines training units, not calibrated
  post-demosaic covariance or SNR. Channel means normalize four versus twelve
  coefficients. Pixel/gradient terms already score delivered RGB and are unchanged.
  Architecture, all 33713 parameters / 13 tensors, inference, input evidence,
  band/bound, support, data/geometry/domain weights, initialization, LR/schedule,
  clipping, EMA and 1k horizon otherwise match. All86 neural source files stay
  byte-identical. No target/reference enters forward. Ten discarded CUDA updates
  per arm include genuine8+2 state restoration and explicit zero-ADC gradients;
  production restarts fresh. All six fixed raw/EMA endpoints use the same822
  quality cases,4932 head calls,84 native figures and36 repeated-cell triplets.
  Actual blank/quiet error, noisy flats, ADC photos/slopes and both standing real
  scenes/priors/windows/JPEGs remain included. ISO100/AHD/JPEG references remain
  qualitative,not exactGT. Adaptive reused cohort,not fresh independent validation.
  No new parents/DINO,noise draws,source/original lookup,RAW decode or dataz access.
  Protected captures,siblings,JPEGs and validation sources stay out of training.
