experiment_notes: >-
  One-pass native RGB restoration initialized strictly from verified original RGB
  DRUNet weights, zero measurement/camera input adapter and zero frozen DINOv3
  fusion gate. Affine-normalized linear camera RGB with a spatial marginal-noise
  proxy; no GAT/HQS iterations. All restoration weights trainable. Expected mix:
  50% Commons/procedural, 25% paired RAW, 25% binned native RAW synthetic. Existing
  calibrated measured-CFA/auxiliary losses and highlight/exposure augmentation.
  Stop after 1000 steps for review against frozen V16 and HQS8. No protected-final
  or GFX qualitative scene/siblings. Compare later matched no-DINO arm separately;
  neither this recipe nor an initialization smoke is a quality claim.
