experiment_notes: Fresh frozen DINO capacity comparison alongside V44 ViT-S and V45
  no-context. Same verified Gaussian RGB initialization, zero measurement/camera projection,
  zero DINO gate, seed48, batch16, LR1e-4/planned10000 first1000 review, fixed original40170
  Commons4/native128/paired32 and original8 validation, physical anchors/GAT and original
  full-resolution/precision. No inherited JDD/DINO restoration history. Only frozen
  foundation identity/feature width and its matching input adapter change versus V44.
  All shared CNN tensors and initial predictions must match all three; all logged
  input/target hashes must match. This isolates architecture on the fixed baseline
  corpus independently of V50. No low-rank adaptation; no GPU preflight/training overlap
  with V50; quality and convergence unproven. Explicit FP32 middle skip in all arms
  matches the promotion already present with a DINO offset; AMP convolutions remain
  unchanged. Prepared fresh recipes updated before any training; older CPU-only receipts
  remain historical.
