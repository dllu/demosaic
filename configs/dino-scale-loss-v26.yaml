experiment_notes: Matched scale-aware-loss experiment from frozen V16 step5000 EMA.
  Only new factor8 coarse RGB correction trains (27696 parameters), same architecture/initial
  weights, seed46, LR5e-4, 50/50 paired/Commons original data, per-step RNG and sampled
  actual batch hashes. V26 adds weight0.01 normalized pooled measured-CFA loss at
  packed4/16/32 blocks (sensor8/32/64); V27 original loss weight0. Each complete block
  uses clean-target-conditioned shot/read input variance, not posterior covariance;
  ADC-only, clipped/invalid blocks excluded. Planned5000 schedule, predeclared first
  review1000. Original restoration/DINO/fine branch frozen. No native-target substitutions,
  protected final or GFX qualitative scenes/siblings in training.
