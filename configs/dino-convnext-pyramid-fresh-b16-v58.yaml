experiment_notes: Prepared only; no actual training is authorized to overlap the owned
  fresh no-context/ViT-S/ViT-B to10000 workflow. Fresh verified original Gaussian
  RGB prior, no preceding JDD weights, seed48, batch16, LR1e-4, warmup100, planned10000.
  Same original paired32/native128/Commons40170 and original8 validation, proportions,
  pre-final geometry/PSF and FP32 physical/native/middle skips. Frozen genuine ConvNeXt-Tiny
  replaces ViT-S with a top-down pyramid and zero-gated offsets at three CNN resolutions.
  Earlier offsets retain their existing hidden dtype; this changes backbone, feature
  fusion and parameter count together, not an isolated backbone-capacity ablation.
  No input adapter/LoRA/weak-source/new ADC policy. CPU engineering is not CUDA or
  quality evidence. Require full GPU engineering validation, observation hash agreement
  and a review of the preceding longer trial before launch; evaluate native exact-GT
  triplets, weak texture/flat false detail and all standing real/GFX crops. A 1000-update
  first gate would use the original10000-step schedule, not a rescaled schedule; no
  convergence or SOTA claim.
