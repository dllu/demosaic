# Corrected target, camera metadata, rendered highlight mask, and ADC black offset.
manifest: /mnt/external/demosaic/commons-v1/commons-1024.jsonl
run: /mnt/external/demosaic/runs/highlight-v3
device: cuda
seed: 42
steps: 20000
batch_size: 8
patch_size: 256
workers: 2
cpu_threads: 4
synthetic_fraction: 0.2
reconstruct_highlights: true
preserve_negative_read_noise: true
lr: 0.0002
warmup_steps: 200
checkpoint_every: 500
val_batches: 16
log_every: 25
amp: true
min_available_gb: 12
model:
  width: 32
  encoder_blocks: [2, 2, 4]
  middle_blocks: 6
  decoder_blocks: [2, 2, 2]
  attention: true
  dino: false
  camera_conditioning: true
