experiment_notes: Experimental fresh RAW-native backbone, not an RGB checkpoint continuation.
  Six groups of eight width96 gated blocks at native quarter resolution, lossless
  CFA packing, width32 half-resolution detail path, fixed camera-linear feature coordinates
  and frozen pinned DINOv3 ConvNeXt pyramid. Original planned40000 schedule / LR2e-4
  / warmup500; first quality review at2000 via explicit --stop-after 2000, with no
  automatic continuation or promotion. Keep frozen40170 Commons/native128/paired32,
  all source splits, wide8 palette, augmentation/noise/loss and B16 unchanged. Throughput,
  finite-state and portable-checkpoint checks required before any quality run. Previous
  DRUNet models are external quality references, not matched warm-start or convergence
  controls.
